[project]
name = "neurocore"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "opendeep[cf]",
    "typer>=0.12",
    "rich>=13",
    "PySide6>=6.7",
]

[project.scripts]
neurocore = "neurocore.cli:main"
neurocore-gui = "neurocore.gui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["neurocore"]

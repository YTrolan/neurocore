[project]
name = "neurocore"
version = "1.0.2"
requires-python = ">=3.10"
dependencies = [
    "opendeep[cf]",
    "typer>=0.12",
    "rich>=13",
    "PySide6>=6.7",
    "openai",
    "requests",
    "curl_cffi",
    "wasmtime",
    "numpy>=1.24",
    "pyte",
    "playwright",
    "python-docx",
    "pypdf",
    "openpyxl",
    "pyyaml",
    "xmltodict",
    "tomli-w",
    "tomli; python_version < '3.11'",
    "croniter",
    "markdown",
    "psutil",
    "Pillow",
    "opencv-python",
    "pyperclip",
    "tzdata; platform_system == 'Windows'",
    "pyautogui; platform_system == 'Windows'",
    "pygetwindow; platform_system == 'Windows'",
    "pydirectinput; platform_system == 'Windows'",
    "pywinpty; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = ["ruff>=0.9"]
build = ["pyinstaller"]

[project.scripts]
neurocore = "neurocore.cli:main"
neurocore-gui = "neurocore.gui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["neurocore"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["F", "I"]

name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          pip install pydirectinput pywinpty pygetwindow pyautogui
      - name: Build EXE
        run: python build_full.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: NeuroCore-Windows
          path: dist/NeuroCore.exe

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system libs
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-xinerama0 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libdbus-1-3 libegl1 libgl1 libglib2.0-0 libfontconfig1
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build Linux binary
        run: |
          pyinstaller --name NeuroCore --onefile --noconfirm --clean --log-level ERROR --hidden-import wasmtime --hidden-import numpy --collect-all opendeep --collect-all curl_cffi --collect-all wasmtime --collect-all numpy --collect-all pyte --collect-all pyperclip run.py
      - name: Rename
        run: mv dist/NeuroCore dist/NeuroCore-linux-x64
      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: NeuroCore-Linux
          path: dist/NeuroCore-linux-x64

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NeuroCore-Windows
          path: artifacts/windows
      - uses: actions/download-artifact@v4
        with:
          name: NeuroCore-Linux
          path: artifacts/linux
      - name: Show
        run: ls -la artifacts/windows artifacts/linux
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows/NeuroCore.exe
            artifacts/linux/NeuroCore-linux-x64
          fail_on_unmatched_files: true
